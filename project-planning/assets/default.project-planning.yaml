# Copy to your project root as `.project-planning.yaml` and adjust.
# See references/frontmatter-schema.md for work-item YAML in epic/story files.

version: 1

defaults:
  epics_dir: Epics
  stories_dir: Stories
  # tasks_dir: planning/tasks   # optional

source_globs:
  - PRD.md
  - "docs/**/*.md"
  - "**/adr/**/*.md"

naming:
  epic_prefix: Epic-
  story_prefix: Story-
  task_prefix: Task-

# Backlog SSOT (omit = files = markdown Epics/ and Stories/)
# delivery_tracker: files   # default — use EpicManager, StoryManager, LintPlan
# delivery_tracker: linear  # backlog in Linear only — references/linear-adoption.md
# tracker_index: planning/tracker-index.md   # optional URL pointers when using a tracker
