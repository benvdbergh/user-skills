# Copy to your project root as `.project-planning.yaml` and adjust.
# Files-platform work-item YAML: references/frontmatter-schema.md
# Tracker native types: references/<delivery_tracker>-adoption.md

version: 1

defaults:
  epics_dir: Epics
  stories_dir: Stories
  # tasks_dir: planning/tasks   # optional

source_globs:
  - PRD.md
  - "docs/**/*.md"
  - "**/adr/**/*.md"

# Files platform only — ignored when delivery_tracker is a tracker
naming:
  epic_prefix: Epic-
  story_prefix: Story-
  task_prefix: Task-

# Backlog SSOT (omit = files). Then load references/<value>-adoption.md
# delivery_tracker: files           # markdown Epics/Stories — files-adoption.md
# delivery_tracker: linear          # Linear Project / Milestone / Issue
# delivery_tracker: jira            # Jira Epic / Feature / Story
# tracker_index: planning/tracker-index.md   # optional URL pointers (native ids)
