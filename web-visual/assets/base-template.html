<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- {{CDN_DEPENDENCIES}} -->
    <style>
        /* ============================================
           Design Tokens (from assets/design-tokens.md)
           ============================================ */
        :root {
            --color-primary: #2563eb;
            --color-primary-light: #60a5fa;
            --color-primary-dark: #1d4ed8;
            --color-secondary: #7c3aed;
            --color-accent: #06b6d4;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-error: #ef4444;
            --color-bg: #ffffff;
            --color-bg-secondary: #f8fafc;
            --color-bg-tertiary: #f1f5f9;
            --color-surface: #ffffff;
            --color-border: #e2e8f0;
            --color-text: #0f172a;
            --color-text-secondary: #475569;
            --color-text-muted: #94a3b8;
            --color-text-inverse: #ffffff;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            --font-size-xs: clamp(0.75rem, 1.5vw, 0.8rem);
            --font-size-sm: clamp(0.8rem, 2vw, 0.875rem);
            --font-size-base: clamp(0.95rem, 2.5vw, 1.0625rem);
            --font-size-lg: clamp(1.1rem, 3vw, 1.25rem);
            --font-size-xl: clamp(1.3rem, 3.5vw, 1.5rem);
            --font-size-2xl: clamp(1.6rem, 4vw, 2rem);
            --font-size-3xl: clamp(2rem, 5vw, 2.75rem);
            --font-size-4xl: clamp(2.5rem, 6vw, 3.5rem);
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;
            --line-height-tight: 1.25;
            --line-height-normal: 1.5;
            --line-height-relaxed: 1.65;
            --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
            --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
            --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
            --space-16: 4rem; --space-20: 5rem; --space-24: 6rem;
            --max-width: 1200px;
            --max-width-narrow: 720px;
            --content-padding: var(--space-6);
            --section-gap: var(--space-16);
            --radius-sm: 0.375rem; --radius-md: 0.5rem;
            --radius-lg: 0.75rem; --radius-xl: 1rem;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --duration-fast: 150ms; --duration-normal: 250ms;
            --duration-slow: 400ms; --duration-slower: 700ms;
            --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out: cubic-bezier(0, 0, 0.2, 1);
            --chart-1: #2563eb; --chart-2: #7c3aed; --chart-3: #06b6d4;
            --chart-4: #10b981; --chart-5: #f59e0b; --chart-6: #ef4444;
        }

        [data-theme="dark"] {
            --color-bg: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-bg-tertiary: #334155;
            --color-surface: #1e293b;
            --color-border: #334155;
            --color-text: #f1f5f9;
            --color-text-secondary: #94a3b8;
            --color-text-muted: #64748b;
            --color-primary-light: #93c5fd;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.3);
        }

        /* ============================================
           Base Styles
           ============================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

        body {
            font-family: var(--font-sans);
            font-size: var(--font-size-base);
            line-height: var(--line-height-relaxed);
            color: var(--color-text);
            background: var(--color-bg);
            transition: background var(--duration-normal) var(--ease-default),
                        color var(--duration-normal) var(--ease-default);
        }

        h1, h2, h3, h4 { line-height: var(--line-height-tight); letter-spacing: -0.025em; }
        h1 { font-size: var(--font-size-4xl); font-weight: var(--font-weight-bold); }
        h2 { font-size: var(--font-size-2xl); font-weight: var(--font-weight-semibold); }
        h3 { font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); }

        a { color: var(--color-primary); text-decoration: none; }
        a:hover { color: var(--color-primary-dark); }
        :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================
           Navigation
           ============================================ */
        .nav {
            position: sticky; top: 0; z-index: 100;
            background: var(--color-bg); border-bottom: 1px solid var(--color-border);
            padding: var(--space-4) var(--content-padding);
            backdrop-filter: blur(8px);
            background: color-mix(in srgb, var(--color-bg) 85%, transparent);
        }
        .nav__inner {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav__links { display: flex; gap: var(--space-4); list-style: none; }
        .nav__links a {
            font-size: var(--font-size-sm); color: var(--color-text-secondary);
            font-weight: var(--font-weight-medium);
        }
        .nav__links a:hover { color: var(--color-primary); }

        .theme-toggle {
            background: none; border: 1px solid var(--color-border);
            border-radius: var(--radius-full); padding: var(--space-2);
            cursor: pointer; color: var(--color-text-secondary);
            transition: all var(--duration-fast) var(--ease-default);
        }
        .theme-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); }

        /* ============================================
           Layout
           ============================================ */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--content-padding);
        }
        main { padding: var(--section-gap) 0; }
        section { margin-bottom: var(--section-gap); }

        /* ============================================
           Scroll Animations
           ============================================ */
        .reveal {
            opacity: 0; transform: translateY(20px);
            transition: opacity var(--duration-slow) var(--ease-out),
                        transform var(--duration-slow) var(--ease-out);
        }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        /* ============================================
           Print
           ============================================ */
        @media print {
            .nav, .theme-toggle { display: none !important; }
            body { color: #000; background: #fff; }
            .reveal { opacity: 1 !important; transform: none !important; }
        }

        /* ============================================
           {{COMPONENT_STYLES}}
           ============================================ */
    </style>
</head>
<body>
    <nav class="nav" aria-label="Main navigation">
        <div class="nav__inner">
            <strong>{{PAGE_TITLE}}</strong>
            <ul class="nav__links">
                <!-- {{NAV_LINKS}} -->
            </ul>
            <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </div>
    </nav>

    <main class="container">
        <!-- {{CONTENT_SECTIONS}} -->
    </main>

    <footer class="container" style="padding-bottom: var(--space-12); text-align: center; color: var(--color-text-muted); font-size: var(--font-size-sm);">
        <p>Generated with web-visual</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme toggle
            const toggle = document.querySelector('.theme-toggle');
            const html = document.documentElement;
            const saved = localStorage.getItem('theme');
            if (saved) html.setAttribute('data-theme', saved);

            toggle?.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });

            // Scroll reveal
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

            // Smooth scroll for nav links
            document.querySelectorAll('a[href^="#"]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.querySelector(link.getAttribute('href'));
                    target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });

            // {{COMPONENT_SCRIPTS}}
        });
    </script>
</body>
</html>
